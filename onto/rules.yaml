# 루트 기본 규칙. 모든 지식 저장소에 적용된다. 규칙을 바꿀 때 코드를 고치지 않는다.
#
# - 이 파일에는 값과 심각도만 둔다. 검사 로직은 코드(`onto_tool/checks/`)에, 구조 제약은 `vocab/shapes.ttl`에 있다.
# - 지식 저장소는 자기 `docs/ontology/ontology.yaml`의 `rules`에서 이 파일의 일부를 덮어쓴다. 덮어쓴 값은 그 저장소에만 적용되고,
#   덮어쓰지 않은 항목은 이 파일의 값을 따른다. 같은 구조로 쓰고, 바꿀 값만 적는다.
#       rules:
#         checks:
#           orphan-page: {enabled: false}
#         sources:
#           include: ["docs/**/*.md", "design/**/*.md"]
# - 루트 전용: `push-gate`, 공유 범위 검사 항목, 규칙을 담은 `ontology.yaml` 자체의 문제를 보고하는 항목(`invalid-ontology-yaml`,
#   `invalid-class-declaration`)은 지식 저장소가 덮어쓸 수 없다. 덮어쓰려 하면 `invalid-rules` 오류로 알린다. 공유 범위 검사 항목은
#   그 검사가 생길 때 아래 `checks`에 루트 전용으로 더해진다.
# - 모르는 키는 오류다. 이 파일에 모르는 키가 있으면 도구가 파일과 키 이름을 알리며 멈춘다. 지식 저장소의 `rules`에 있으면
#   `invalid-rules` 오류로 알리고, 그 저장소는 `rules` 없이 이 파일의 값으로 검사한다.
# - 이 파일은 루트 관리 파일이다. 지식 저장소에는 `.onto/rules.yaml`로 복사되어 그 저장소의 기본값이 된다.
#   손으로 고치지 않는다(최신화가 덮어쓴다). 고치는 곳은 루트 저장소의 `onto/rules.yaml`이다.

# ingest 대상: 지식 저장소 안에서 원본 문서로 삼는 파일. 글롭은 지식 저장소의 루트 기준이다.
# `exclude`는 `include`에서 뺄 경로다. 온톨로지 층(`docs/ontology/`)은 이 값과 무관하게 항상 대상에서 빠진다.
# 코드는 원본 문서가 아니므로 `include`에 두지 않는다. 낡음과 새 원본 문서를 보여 주는 `onto status`가 읽는다.
sources:
  include:
    - "docs/**/*.md"
  exclude:
    - "docs/ontology/**"

# 검사 항목별 켬/끔(`enabled`)과 심각도(`severity`: `error` 또는 `warning`). 항목의 이름은 `just onto validate` 보고의 검사 항목 칸에
# 나오는 이름이다. 오류는 종료 코드를 0이 아니게 하고 푸시 관문이 막는다. 경고는 참고할 것이다.
# 항목마다 한 줄이고, 모든 검사 항목이 여기에 있어야 한다(빠지면 도구가 알린다).
# `build`와 `query`는 읽을 수 없는 파일이 있으면 규칙과 무관하게 멈춘다(일부만 컴파일한 그래프를 내놓지 않는다). 읽을 수 없는 파일을
# 보고하는 항목을 루트가 끄거나 경고로 낮추면 `validate`는 통과해도 `build`는 멈춘다.
checks:
  # 읽을 수 없는 파일과 값
  unreadable-file: {enabled: true, severity: error}
  invalid-value: {enabled: true, severity: error}
  invalid-class-declaration: {enabled: true, severity: error}
  invalid-ontology-yaml: {enabled: true, severity: error}
  invalid-identifier: {enabled: true, severity: error}
  # 페이지의 위치
  misplaced-page: {enabled: true, severity: error}
  misnamed-page: {enabled: true, severity: error}
  # 구조 제약
  missing-property: {enabled: true, severity: error}
  disallowed-class: {enabled: true, severity: error}
  relation-domain: {enabled: true, severity: error}
  relation-range: {enabled: true, severity: error}
  # 키와 참조
  undefined-key: {enabled: true, severity: error}
  reverse-relation: {enabled: true, severity: error}
  broken-reference: {enabled: true, severity: error}
  unregistered-repository: {enabled: true, severity: error}
  orphan-page: {enabled: true, severity: warning}
  # 중복
  duplicate-entity: {enabled: true, severity: error}
  duplicate-entity-across-repositories: {enabled: true, severity: warning}
  # 지식 저장소와 규칙
  repository-name-mismatch: {enabled: true, severity: error}
  missing-ontology-layer: {enabled: true, severity: warning}
  invalid-rules: {enabled: true, severity: error}
  # 인덱스
  index-mismatch: {enabled: true, severity: error}

# 푸시 관문(루트 전용): `just git push`가 푸시 전에 스크립트 검사를 돌리고, 오류가 있으면 아무것도 올리지 않는다.
# 끄면 검사 없이 푸시한다. 지식 저장소의 규칙으로는 끌 수 없다. `git` 모듈의 `push`가 읽는다.
push-gate:
  enabled: true

# 중복 처리: 이름이 같은 엔티티를 가려내는 방법. 같은 클래스 안에서, `compare`에 적은 속성(`title`, `aliases`)의 값으로 비교한다.
# 같은 지식 저장소 안의 중복과 저장소 사이의 중복은 위 `checks`의 항목이 서로 다른 심각도로 보고한다.
duplicates:
  compare: [title, aliases]
  ignore-case: true
  ignore-whitespace: true

# 언어 규칙.
# - `identifier-pattern`: 식별자의 경로 조각(`/`로 나눈 조각 하나) 전체가 맞아야 하는 정규 표현식이다. 기본은 영어 소문자, 숫자, 하이픈이고,
#   스크립트 검사의 `invalid-identifier`가 쓴다. `:`나 앞뒤 공백을 허용하는 형식은 거부한다(교차 참조 `<저장소 이름>:<식별자>`가 깨진다).
# - `body`: 페이지의 제목과 본문을 쓰는 언어. `source`는 원본 문서의 언어를 따른다. `ko`, `en`, `pt-BR` 같은 언어 코드를 적으면 항상 그 언어로 쓴다.
# - `aliases`: 페이지의 `aliases`에 별칭을 두는 언어 코드의 목록. 한·영 별칭을 둔다.
# 식별자, 파일명, frontmatter 키, 클래스 이름은 영어로 쓴다. 이 중 `body`와 `aliases`는 에이전트 스킬과 규약 문서가 읽는다.
language:
  identifier-pattern: "[a-z0-9-]+"
  body: source
  aliases: [ko, en]
